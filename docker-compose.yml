version: '3.8'

services:
  web:
    build: .
    container_name: webapp_api
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=s67160214
      - DB_USER=s67160214
      - DB_PASSWORD=W5xPdkn9

  db:
    image: mysql:8.0
    container_name: webapp_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: s67160214
      MYSQL_USER: s67160214
      MYSQL_PASSWORD: W5xPdkn9
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: webapp_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db

volumes:
  db_data: