
services:
  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hugmart_web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - hugmart_net

  db:
    image: mysql:8.0
    container_name: hugmart_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: hugmart_db
      MYSQL_USER: hugmart_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-W5xPdkn9}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
    networks:
      - hugmart_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: hugmart_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    depends_on:
      - db
    networks:
      - hugmart_net

networks:
  hugmart_net:
    driver: bridge

volumes:
  db_data: